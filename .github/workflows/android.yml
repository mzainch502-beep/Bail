name: Build Android APK
on:
  push:
    branches: [main]
    paths: ['android/**', 'web/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: gradle -p android :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon
      - name: Verify package
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging android/app/build/outputs/apk/debug/app-debug.apk
          mkdir -p deliverables
          cp android/app/build/outputs/apk/debug/app-debug.apk deliverables/Bail-0.1.0.apk
          sha256sum deliverables/Bail-0.1.0.apk > deliverables/SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Bail-Android-APK
          path: deliverables/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: Android-smoke-test-packages
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
  device-check:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Android-smoke-test-packages
          path: packages
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install packages/debug/app-debug.apk
            adb install packages/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w online.bail.studio.beta.test/androidx.test.runner.AndroidJUnitRunner | tee smoke-result.txt
            grep -q 'OK (2 tests)' smoke-result.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-device-check
          path: smoke-result.txt
          if-no-files-found: ignore
